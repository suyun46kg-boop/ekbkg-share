<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🇰🇬</title>
<meta name="theme-color" content="#FFFFFF">
<meta property="og:title" content="🇰🇬">
<meta property="og:image" content="https://suyun46kg-boop.github.io/ekbkg-share/og.jpg">
<meta property="og:image:width" content="1080">
<meta property="og:image:height" content="1350">
<meta property="og:url" content="https://suyun46kg-boop.github.io/ekbkg-share/">
<link rel="icon" href="icon-192.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;background:#fff;color:#1A1A1A;-webkit-tap-highlight-color:transparent;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{min-height:100dvh;display:flex;align-items:center;justify-content:center;
       padding:32px 24px calc(32px + env(safe-area-inset-bottom))}
  .wrap{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .logo{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.12);margin-bottom:22px}
  h1{font-size:34px;font-weight:800;letter-spacing:.02em;color:#1A1A1A;margin-bottom:10px}
  .sub{font-size:17px;line-height:1.45;color:#5F5E5A;margin-bottom:38px;max-width:320px}
  .btns{width:100%;display:flex;flex-direction:column;gap:12px}
  .btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:62px;border-radius:16px;
       border:1px solid #E3E3E6;background:#F6F6F7;color:#1A1A1A;font:inherit;font-weight:600;font-size:15px;
       letter-spacing:.06em;cursor:pointer;-webkit-appearance:none;appearance:none;transition:transform .12s ease,background .12s ease}
  .btn:active{transform:scale(.98);background:#ECECEF}
  .btn.primary{height:66px;background:#1A1A1A;border-color:#1A1A1A;color:#fff;font-size:16px;font-weight:700}
  .btn.primary:active{background:#000}
  .btn svg{flex:none}
  .btn.share{justify-content:flex-start;padding:0 16px}
  .lbl{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left}
  .lbl b{font-weight:700;font-size:15px;letter-spacing:.08em}
  .lbl small{font-size:12px;letter-spacing:.06em;color:#8A8A90;text-transform:uppercase}
  .hint{min-height:40px;margin-top:18px;font-size:13px;line-height:1.4;color:#5F5E5A;opacity:0;transition:opacity .3s ease}
  .hint.show{opacity:1}
</style>
</head>
<body>
<main class="wrap">
  <img class="logo" src="icon-192.png" alt="EKBKG" width="96" height="96">
  <h1>EKBKG</h1>
  <p class="sub">EKBKG — жүктөп алыңыз жана досторуңуз менен бөлүшүңүз</p>

  <div class="btns">
    <button class="btn primary" id="dl" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 19h16"/></svg>
      <span>ЖҮКТӨП АЛУУ</span>
    </button>

    <button class="btn share" id="wa" type="button">
      <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="20" fill="#25D366"/>
        <g transform="translate(8.5 8.5) scale(.96)" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s1 2.6 1.1 2.7c.1.2 1.9 2.9 4.6 4 1.7.7 2.4.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></g>
      </svg>
      <span class="lbl"><b>WHATSAPP</b><small>Статус</small></span>
    </button>

    <button class="btn share" id="ig" type="button">
      <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true">
        <defs><linearGradient id="igg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FEDA75"/><stop offset=".35" stop-color="#FA7E1E"/><stop offset=".65" stop-color="#D62976"/><stop offset="1" stop-color="#962FBF"/></linearGradient></defs>
        <circle cx="20" cy="20" r="20" fill="url(#igg)"/>
        <g transform="translate(9.5 9.5)" fill="none" stroke="#fff" stroke-width="1.9"><rect x="1" y="1" width="19" height="19" rx="5.5"/><circle cx="10.5" cy="10.5" r="4.3"/><circle cx="15.8" cy="5.2" r="1" fill="#fff" stroke="none"/></g>
      </svg>
      <span class="lbl"><b>INSTAGRAM</b><small>История</small></span>
    </button>
  </div>

  <p class="hint" id="hint"></p>
</main>

<script>
(function () {
  // ===== Подсчёт кликов (заполнить при желании; пусто — подсчёт выключен) =====
  var SUPABASE_URL = '';        // например 'https://ekbkyrgyz.site'
  var SUPABASE_ANON_KEY = '';   // публичный publishable-ключ, как на /app

  var SHARE_URL = 'https://is.gd/ekbkg_app';
  var qs = new URLSearchParams(location.search);
  var src = (qs.get('s') || 'share').slice(0, 64);
  var ua = navigator.userAgent || '';
  var platform = /iPhone|iPad|iPod/i.test(ua) ? 'ios' : (/Android/i.test(ua) ? 'android' : 'desktop');

  function log(source) {
    if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return;
    try {
      fetch(SUPABASE_URL + '/rest/v1/smartlink_clicks', {
        method: 'POST', keepalive: true,
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
        body: JSON.stringify({ source: source, platform: platform, user_agent: ua.slice(0, 500) })
      }).catch(function () {});
    } catch (e) {}
  }
  log(src);

  // ===== Поделиться =====
  var storyFile = null;
  fetch('story.jpg').then(function (r) { return r.blob(); }).then(function (b) {
    storyFile = new File([b], 'kyrgyz.jpg', { type: 'image/jpeg' });
  }).catch(function () {});
  function canFile() { return storyFile && navigator.canShare && navigator.canShare({ files: [storyFile] }); }
  function buzz() { if (navigator.vibrate) navigator.vibrate(10); }
  var hint = document.getElementById('hint');
  function say(t, ms) { hint.textContent = t; hint.classList.add('show'); clearTimeout(say.t); say.t = setTimeout(function () { hint.classList.remove('show'); }, ms || 3200); }
  function copySync(text) {
    try {
      var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'absolute'; ta.style.left = '-9999px'; document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, 99999); var ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch (e) { return false; }
  }
  function copy(text) {
    if (copySync(text)) return true;
    if (navigator.clipboard) { navigator.clipboard.writeText(text).catch(function () {}); return true; }
    return false;
  }

  document.getElementById('wa').addEventListener('click', function () {
    buzz(); log('wa_click');
    location.href = 'https://wa.me/?text=' + encodeURIComponent('🇰🇬 EKBKG- приложениясын ушул жерден жүктөп алыңыз жана досторунуз менен бөлүшүңүз 👇\n' + SHARE_URL);
  });

  document.getElementById('ig').addEventListener('click', function () {
    buzz(); log('ig_click');
    copy(SHARE_URL);
    say('Тизмеден Instagram → «Окуя» тандаңыз. Шилтеме көчүрүлдү — «Шилтеме» стикерине чаптаңыз', 9000);
    if (canFile()) navigator.share({ files: [storyFile] }).catch(function () {});
    else {
      var a = document.createElement('a'); a.href = 'story.jpg'; a.download = 'kyrgyz.jpg'; document.body.appendChild(a); a.click(); a.remove();
    }
  });

  var IOS = 'https://apps.apple.com/app/id6790087427';
  var GP = 'https://play.google.com/store/apps/details?id=mycompany.ekbkyrgyzdar&referrer=' + encodeURIComponent('utm_source=' + src + '&utm_medium=share_page');
  document.getElementById('dl').addEventListener('click', function () {
    buzz(); log('download_click');
    location.href = platform === 'ios' ? IOS : (platform === 'android' ? GP : 'https://ekbkyrgyz.site/app?s=' + encodeURIComponent(src));
  });
})();
</script>
</body>
</html>
