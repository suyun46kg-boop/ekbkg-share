<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🇰🇬</title>
<meta name="theme-color" content="#070B12">
<meta property="og:title" content="🇰🇬">
<meta property="og:image" content="https://share.ekbkyrgyz.site/story.jpg">
<meta property="og:url" content="https://share.ekbkyrgyz.site/">
<link rel="icon" href="icon-192.png">
<link rel="preload" href="display.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="poster.jpg" as="image">
<style>
  @font-face{font-family:"D";src:url(display.woff2) format("woff2");font-weight:800;font-display:swap}
  @font-face{font-family:"U";src:url(ui.woff2) format("woff2");font-weight:600;font-display:swap}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#070B12;color:#fff;-webkit-tap-highlight-color:transparent;
            font-family:"U",-apple-system,BlinkMacSystemFont,Roboto,sans-serif;overscroll-behavior:none}
  .stage{position:fixed;inset:0;height:100dvh;overflow:hidden}
  video,.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .poster{background:#070B12 url(poster.jpg) center/cover no-repeat}
  #intro{z-index:2;transition:opacity .5s ease}
  #loop{z-index:1}
  #grain{position:absolute;inset:-2px;width:calc(100% + 4px);height:calc(100% + 4px);z-index:3;opacity:.09;mix-blend-mode:overlay;pointer-events:none;image-rendering:pixelated}
  .shade{position:absolute;inset:0;z-index:4;pointer-events:none;
         background:radial-gradient(120% 85% at 50% 40%,transparent 55%,rgba(0,0,0,.55) 100%),
                    linear-gradient(to bottom,rgba(7,11,18,.35) 0%,transparent 18%,transparent 50%,rgba(7,11,18,.75) 72%,rgba(7,11,18,.95) 100%)}
  .ui{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:0 22px calc(18px + env(safe-area-inset-bottom))}
  h1{font-family:"D",sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:.98;
     font-size:clamp(28px,8.6vw,46px);margin-bottom:22px;text-shadow:0 2px 20px rgba(0,0,0,.35)}
  h1 .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.06em}
  h1 .w>span{display:inline-block;transform:translateY(105%);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
  .on h1 .w>span{transform:none}
  .gold{color:#E9C98F}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{height:56px;border-radius:14px;border:1px solid rgba(216,183,135,.75);background:rgba(10,12,20,.42);
       -webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);
       color:#fff;font:600 14px/1 "U",sans-serif;letter-spacing:.12em;display:flex;align-items:center;justify-content:center;gap:10px;
       cursor:pointer;opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1),background .2s}
  .btn svg{width:20px;height:20px;flex:none}
  .btn.wide{grid-column:1/-1}
  .btn.tall{height:64px;justify-content:flex-start;padding:0 14px;gap:12px}
  .btn .lbl{display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left}
  .btn .lbl b{font-weight:600;font-size:14px;letter-spacing:.1em}
  .btn .lbl small{font-size:11px;letter-spacing:.08em;color:#E9C98F;text-transform:uppercase}
  .ring{width:40px;height:40px;flex:none}
  .share-tag{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.72);
             margin:0 0 10px;opacity:0;transition:opacity .6s ease .45s}
  .share-tag svg{width:16px;height:16px;color:#E9C98F}
  .share-tag::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(216,183,135,.6),transparent)}
  .on .share-tag{opacity:1}
  .btn:active{transform:scale(.97);background:rgba(216,183,135,.2)}
  .on .btn{opacity:1;transform:none}
  .on .btn:nth-child(1){transition-delay:.7s}.on .btn:nth-child(2){transition-delay:.85s}.on .btn:nth-child(3){transition-delay:1s}
  .btn.ok{border-color:#E9C98F;background:rgba(216,183,135,.22)}
  .hint{min-height:18px;margin-top:10px;font-size:12px;color:#E9C98F;text-align:center;opacity:0;transition:opacity .3s}
  .hint.show{opacity:1}
  .stores{display:flex;gap:8px;justify-content:center;margin-top:6px;opacity:0;transition:opacity .8s ease 1.1s}
  .on .stores{opacity:.75}
  .stores a{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:9px;border:1px solid rgba(255,255,255,.22);
            color:#fff;text-decoration:none;font-size:11px;letter-spacing:.06em;background:rgba(0,0,0,.25)}
  .stores svg{width:14px;height:14px}
  .sound{position:absolute;z-index:6;top:calc(14px + env(safe-area-inset-top));right:14px;width:44px;height:44px;border-radius:50%;
         border:1px solid rgba(216,183,135,.6);background:rgba(10,12,20,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
         display:flex;align-items:center;justify-content:center;color:#E9C98F;cursor:pointer}
  .sound svg{width:20px;height:20px}
  .sound .wave{display:none}.sound.on .wave{display:block}.sound.on .mute{display:none}
  .tap{position:absolute;inset:0;z-index:7;display:none}
  @media (max-height:720px){h1{font-size:clamp(24px,7.2vw,34px);margin-bottom:14px}.btn{height:48px}.btn.tall{height:56px}.ui{padding-bottom:calc(12px + env(safe-area-inset-bottom))}}
  @media (prefers-reduced-motion:reduce){h1 .w>span,.btn,.stores{transition:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="poster"></div>
  <video id="loop" muted playsinline loop preload="auto">
    <source src="loop.webm" type="video/webm"><source src="loop.mp4" type="video/mp4">
  </video>
  <video id="intro" muted playsinline autoplay preload="auto" poster="poster.jpg">
    <source src="intro.webm" type="video/webm"><source src="intro.mp4" type="video/mp4">
  </video>
  <canvas id="grain" width="160" height="284"></canvas>
  <div class="shade"></div>

  <button class="sound" id="sound" type="button" aria-label="Үн">
    <svg class="mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
    <svg class="wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  </button>

  <div class="ui" id="ui">
    <h1 id="title">Досторуңуз менен бөлүшүңүз жана <span class="gold">жүктөп алыңыз</span></h1>
    <div class="btns">
      <button class="btn tall" id="wa" type="button">
        <svg class="ring" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="17" fill="none" stroke="#25D366" stroke-width="2.4" stroke-dasharray="20.5 6.2" stroke-linecap="round" transform="rotate(-80 20 20)"/>
          <g transform="translate(8.5 8.5) scale(.96)" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s1 2.6 1.1 2.7c.1.2 1.9 2.9 4.6 4 1.7.7 2.4.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></g>
        </svg>
        <span class="lbl"><b>WHATSAPP</b><small>Статус</small></span>
      </button>
      <button class="btn tall" id="ig" type="button">
        <svg class="ring" viewBox="0 0 40 40" aria-hidden="true">
          <defs><linearGradient id="igg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FEDA75"/><stop offset=".35" stop-color="#FA7E1E"/><stop offset=".65" stop-color="#D62976"/><stop offset="1" stop-color="#962FBF"/></linearGradient></defs>
          <circle cx="20" cy="20" r="17" fill="none" stroke="url(#igg)" stroke-width="2.6"/>
          <g transform="translate(9.5 9.5)" fill="none" stroke="#fff" stroke-width="1.9"><rect x="1" y="1" width="19" height="19" rx="5.5"/><circle cx="10.5" cy="10.5" r="4.3"/><circle cx="15.8" cy="5.2" r="1" fill="#fff" stroke="none"/></g>
        </svg>
        <span class="lbl"><b>INSTAGRAM</b><small>История</small></span>
      </button>
      <button class="btn wide" id="dl" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 19h16"/></svg>
        <span>[ ЖҮКТӨП АЛУУ ]</span>
      </button>
    </div>
    <p class="hint" id="hint"></p>
  </div>
  <div class="tap" id="tap"></div>
</div>

<audio id="aIntro" src="intro_sound.m4a" preload="auto"></audio>
<audio id="aLoop" src="loop_sound.m4a" preload="auto" loop></audio>

<script>
(function () {
  // ===== Подсчёт кликов (заполнить при желании; пусто — подсчёт выключен) =====
  var SUPABASE_URL = '';        // например 'https://ekbkyrgyz.site'
  var SUPABASE_ANON_KEY = '';   // публичный publishable-ключ, как на /app

  var BASE = 'https://share.ekbkyrgyz.site/';
  var SHARE_URL = BASE + '?s=share';
  var qs = new URLSearchParams(location.search);
  var src = (qs.get('s') || 'share').slice(0, 64);
  var ua = navigator.userAgent || '';
  var platform = /iPhone|iPad|iPod/i.test(ua) ? 'ios' : (/Android/i.test(ua) ? 'android' : 'desktop');

  function log(source) {
    if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return;
    try {
      fetch(SUPABASE_URL + '/rest/v1/smartlink_clicks', {
        method: 'POST', keepalive: true,
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
        body: JSON.stringify({ source: source, platform: platform, user_agent: ua.slice(0, 500) })
      }).catch(function () {});
    } catch (e) {}
  }
  log(src);


  // ===== Заголовок по словам =====
  var h = document.getElementById('title'), i = 0;
  (function wrap(node) {
    Array.prototype.slice.call(node.childNodes).forEach(function (n) {
      if (n.nodeType === 3) {
        var frag = document.createDocumentFragment();
        n.textContent.split(/(\s+)/).forEach(function (part) {
          if (!part) return;
          if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(' ')); return; }
          var w = document.createElement('span'); w.className = 'w';
          var s = document.createElement('span'); s.textContent = part;
          s.style.transitionDelay = (i++ * 0.07) + 's';
          w.appendChild(s); frag.appendChild(w);
        });
        n.parentNode.replaceChild(frag, n);
      } else if (n.nodeType === 1) wrap(n);
    });
  })(h);

  // ===== Видео =====
  var intro = document.getElementById('intro'), loop = document.getElementById('loop'), ui = document.getElementById('ui');
  var stage = document.getElementById('stage'), tap = document.getElementById('tap');
  var shown = false, switched = false;
  function showUI() { if (!shown) { shown = true; stage.classList.add('on'); } }

  intro.addEventListener('timeupdate', function () {
    var t = intro.currentTime, d = intro.duration || 6.7;
    if (t > 4) showUI();
    if (!switched && t > d - 0.55) {
      switched = true;
      loop.currentTime = 0; loop.play().catch(function () {});
      intro.style.opacity = 0;
      if (soundOn) { aLoop.currentTime = 0; aLoop.play().catch(function () {}); }
    }
  });
  intro.addEventListener('ended', function () {
    if (!switched) { switched = true; loop.play().catch(function () {}); intro.style.opacity = 0; }
    showUI();
  });
  // На всякий случай — показать интерфейс через 6 сек в любом случае
  setTimeout(showUI, 6000);

  function tryPlay() {
    var p = intro.play();
    if (p && p.catch) p.catch(function () {
      tap.style.display = 'block'; showUI();
    });
  }
  tap.addEventListener('click', function () { tap.style.display = 'none'; intro.play().catch(function () {}); });
  loop.load(); tryPlay();
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && switched) loop.play().catch(function () {});
  });

  // ===== Зерно =====
  var cv = document.getElementById('grain'), cx = cv.getContext('2d');
  var lowEnd = (navigator.hardwareConcurrency || 4) <= 2 || matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (lowEnd) cv.style.display = 'none';
  else {
    var img = cx.createImageData(cv.width, cv.height), fr = 0;
    (function noise() {
      if ((fr++ & 1) === 0) {
        var d = img.data;
        for (var k = 0; k < d.length; k += 4) { var v = Math.random() * 255 | 0; d[k] = d[k + 1] = d[k + 2] = v; d[k + 3] = 255; }
        cx.putImageData(img, 0, 0);
      }
      requestAnimationFrame(noise);
    })();
  }

  // ===== Звук =====
  var aIntro = document.getElementById('aIntro'), aLoop = document.getElementById('aLoop');
  var soundBtn = document.getElementById('sound'), soundOn = false;
  function fadeIn(a) { a.volume = 0; var v = 0; var t = setInterval(function () { v += 0.1; a.volume = Math.min(1, v); if (v >= 1) clearInterval(t); }, 50); }
  soundBtn.addEventListener('click', function () {
    soundOn = !soundOn; soundBtn.classList.toggle('on', soundOn);
    if (soundOn) {
      log('sound_click');
      if (!switched && !intro.ended) { aIntro.currentTime = intro.currentTime; fadeIn(aIntro); aIntro.play().catch(function () {}); }
      else { fadeIn(aLoop); aLoop.play().catch(function () {}); }
    } else { aIntro.pause(); aLoop.pause(); }
  });
  aIntro.addEventListener('ended', function () { if (soundOn) { aLoop.currentTime = 0; aLoop.play().catch(function () {}); } });

  // ===== Поделиться =====
  var storyFile = null;
  fetch('story.jpg').then(function (r) { return r.blob(); }).then(function (b) {
    storyFile = new File([b], 'kyrgyz.jpg', { type: 'image/jpeg' });
  }).catch(function () {});
  function canFile() { return storyFile && navigator.canShare && navigator.canShare({ files: [storyFile] }); }
  function buzz() { if (navigator.vibrate) navigator.vibrate(10); }
  var hint = document.getElementById('hint');
  function say(t) { hint.textContent = t; hint.classList.add('show'); clearTimeout(say.t); say.t = setTimeout(function () { hint.classList.remove('show'); }, 3200); }
  function copySync(text) {
    try {
      var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'absolute'; ta.style.left = '-9999px'; document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, 99999); var ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch (e) { return false; }
  }
  function copy(text) {
    if (copySync(text)) return true;
    if (navigator.clipboard) { navigator.clipboard.writeText(text).catch(function () {}); return true; }
    return false;
  }

  document.getElementById('wa').addEventListener('click', function () {
    buzz(); log('wa_click');
    var text = '🇰🇬 ' + SHARE_URL;
    if (canFile()) navigator.share({ files: [storyFile], text: text }).catch(function () {});
    else location.href = 'https://wa.me/?text=' + encodeURIComponent(text);
  });

  document.getElementById('ig').addEventListener('click', function () {
    buzz(); log('ig_click');
    copy(SHARE_URL);
    say('Шилтеме көчүрүлдү — сторисиңизге «Шилтеме» стикерин кошуңуз');
    if (canFile()) navigator.share({ files: [storyFile] }).catch(function () {});
    else {
      var a = document.createElement('a'); a.href = 'story.jpg'; a.download = 'kyrgyz.jpg'; document.body.appendChild(a); a.click(); a.remove();
    }
  });

  var IOS = 'https://apps.apple.com/app/id6790087427';
  var GP = 'https://play.google.com/store/apps/details?id=mycompany.ekbkyrgyzdar&referrer=' + encodeURIComponent('utm_source=' + src + '&utm_medium=share_page');
  document.getElementById('dl').addEventListener('click', function () {
    buzz(); log('download_click');
    location.href = platform === 'ios' ? IOS : (platform === 'android' ? GP : 'https://ekbkyrgyz.site/app?s=' + encodeURIComponent(src));
  });
})();
</script>
</body>
</html>
